name: Frontend Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - "Movie-Picture-Pipeline-main/starter/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
           node-version: 20
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('Movie-Picture-Pipeline-main/starter/frontend/package-lock.json')}}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Install dependencies
        working-directory: Movie-Picture-Pipeline-main/starter/frontend
        run: npm ci

      - name: Run lint
        working-directory: Movie-Picture-Pipeline-main/starter/frontend
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('Movie-Picture-Pipeline-main/starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Install dependencies
        working-directory: Movie-Picture-Pipeline-main/starter/frontend
        run: npm ci

      - name: Run tests
        working-directory: Movie-Picture-Pipeline-main/starter/frontend
        run: npm test -- --watchAll=false

  build:
    needs:
      - lint
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('Movie-Picture-Pipeline-main/starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Install dependencies
        working-directory: Movie-Picture-Pipeline-main/starter/frontend
        run: npm ci

      - name: Build Docker image
        run: |
          docker build \
            --build-arg=REACT_APP_MOVIE_API_URL=http://localhost:5000 \
            --tag=mp-frontend:ci \
            ./Movie-Picture-Pipeline-main/starter/frontend
